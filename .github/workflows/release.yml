name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.7.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download Godot
        run: |
          set -e
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fL -o godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fL -o templates.tpz "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q templates.tpz
          mv templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Configure editor settings
        run: |
          set -e
          mkdir -p ~/.config/godot
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          KEY="$GITHUB_WORKSPACE/ci/appathy.keystore"
          if [ ! -f "$KEY" ]; then KEY="$GITHUB_WORKSPACE/debug.keystore"; fi
          cat > ~/.config/godot/editor_settings-4.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$SDK"
          export/android/debug_keystore = "$KEY"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          export/android/shutdown_adb_on_exit = true
          EOF

      - name: Import project
        run: |
          godot --headless --import --path . 2>&1 | tee import.log
          if grep -qiE "SCRIPT ERROR|Parse Error|Failed to load script" import.log; then
            echo "::error::script errors during import"
            exit 1
          fi

      - name: Export APK
        run: |
          set -e
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/GameLab.apk 2>&1 | tee export.log
          test -f build/GameLab.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: build/GameLab.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
